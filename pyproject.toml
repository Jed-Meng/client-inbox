[project]
name = "client-inbox"
version = "0.1.0"
description = "Local app that groups Gmail threads by client and drafts replies in your voice with your own Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.scripts]
client-inbox = "client_inbox.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_inbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
