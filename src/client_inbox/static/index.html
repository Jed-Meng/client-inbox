<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Inbox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <strong>Client Inbox</strong>
    <span id="me" class="muted"></span>
    <span id="sync" class="pill"></span>
    <span class="spacer"></span>
    <span id="voice" class="muted"></span>
    <button id="voice-btn" class="quiet" title="Re-read your sent mail and relearn how you write">Relearn my voice</button>
  </header>

  <main>
    <nav id="clients" aria-label="Clients"></nav>

    <section id="middle">
      <div id="client-bar" hidden>
        <h2 id="client-name"></h2>
        <div class="row">
          <button id="tab-threads" class="tab on">Threads</button>
          <button id="tab-files" class="tab">Files</button>
          <span class="spacer"></span>
          <button id="rename-btn" class="quiet">Rename</button>
          <button id="merge-btn" class="quiet">Merge into…</button>
        </div>
      </div>
      <div id="threads"></div>
      <div id="files" hidden>
        <p class="muted small">Reference files for this client (PDF, Word, Excel, text). Claude searches them when drafting.</p>
        <input id="file-input" type="file" multiple>
        <ul id="file-list"></ul>
      </div>
      <p id="middle-empty" class="muted pad">Pick a client on the left.</p>
    </section>

    <article id="detail">
      <p id="detail-empty" class="muted pad">Pick a thread to see its summary and draft.</p>
      <div id="detail-body" hidden>
        <div class="row">
          <h2 id="subject"></h2>
          <span class="spacer"></span>
          <button id="move-btn" class="quiet">Move to client…</button>
          <a id="gmail-link" target="_blank" rel="noopener">Open in Gmail</a>
        </div>

        <div id="summary-box" class="card">
          <div class="label">Summary <span id="reply-flag" class="pill"></span></div>
          <p id="summary"></p>
        </div>

        <div id="draft-box" class="card">
          <div class="label">Draft reply <span id="draft-status" class="muted"></span></div>
          <textarea id="draft" rows="12" spellcheck="true" placeholder="No draft yet."></textarea>
          <div class="row wrap">
            <button id="copy-btn" class="primary">Copy</button>
            <button id="gmail-btn">Create Gmail draft</button>
            <span class="spacer"></span>
            <input id="instruction" type="text" placeholder="Optional: shorter, decline politely, ask for a call…">
            <button id="regen-btn">Draft a reply</button>
          </div>
          <p id="draft-note" class="small muted"></p>
          <ul id="sources" class="small"></ul>
        </div>

        <div id="messages"></div>
      </div>
    </article>
  </main>

  <dialog id="picker">
    <form method="dialog">
      <h3 id="picker-title"></h3>
      <select id="picker-select"></select>
      <input id="picker-new" type="text" placeholder="New client name" hidden>
      <label id="picker-sender-row" class="small" hidden>
        <input id="picker-sender" type="checkbox"> Also file future mail from this sender here
      </label>
      <div class="row">
        <span class="spacer"></span>
        <button value="cancel" class="quiet">Cancel</button>
        <button value="ok" class="primary">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
